org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Marketplace package of the Wear OS push app. Every pushed watch face APK must be named
# `<this>.watchfacepush.<faceName>`; the packager reads the same value (see docs/PUSH_API.md).
watchface.marketplacePackage=ee.schimke.watchface.push
android.useAndroidX=true

# The version of the published libraries. release-please rewrites the line between the markers
# when it cuts a release; builds are `<this>-SNAPSHOT` unless run with `-Prelease` (release.yml).
# x-release-please-start-version
watchfaceToolsVersion=0.2.1
# x-release-please-end
