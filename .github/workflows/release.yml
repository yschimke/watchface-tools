# Publishes the watchface-tools coordinates (wff-core and wff-apk JVM + Kotlin/Wasm, wff-packager and the BOM)
# to Maven Central for a tag, as far as the publish plan says they changed (docs/VERSIONING.md).
#
# A published coordinate is PERMANENT: Central refuses a second upload of the same GAV, and
# `publishToMavenCentral(automaticRelease = true)` promotes without a human looking. So every
# check that can run before the upload does, and the GitHub release stays a draft until the
# upload succeeds.
name: Release

on:
  workflow_call:
    inputs:
      tag_name:
        description: The `vX.Y.Z` tag to publish.
        required: true
        type: string
    secrets:
      # Optional so a missing one reaches the preflight step, which names it.
      SIGNING_KEY: {required: false}
      SIGNING_KEY_ID: {required: false}
      SIGNING_KEY_PASSWORD: {required: false}
      MAVEN_CENTRAL_USERNAME: {required: false}
      MAVEN_CENTRAL_PASSWORD: {required: false}
  # Re-publish a tag whose first attempt failed BEFORE the upload (a missing secret, say).
  workflow_dispatch:
    inputs:
      tag_name:
        description: The `vX.Y.Z` tag to publish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ inputs.tag_name }}

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: write # un-draft the release once the upload succeeds
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check publishing credentials are configured
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          check() {
            if [ -z "${2:-}" ]; then
              echo "::error::$1 is not set. $3"
              missing=1
            fi
          }
          check SIGNING_KEY "${SIGNING_KEY:-}" "The armoured GPG private key; Central rejects unsigned artifacts."
          check SIGNING_KEY_ID "${SIGNING_KEY_ID:-}" "The GPG key id for that key."
          check SIGNING_KEY_PASSWORD "${SIGNING_KEY_PASSWORD:-}" "The passphrase for that key."
          check MAVEN_CENTRAL_USERNAME "${MAVEN_CENTRAL_USERNAME:-}" "The Central Portal token username."
          check MAVEN_CENTRAL_PASSWORD "${MAVEN_CENTRAL_PASSWORD:-}" "The Central Portal token password."
          [ "$missing" -eq 0 ] || exit 1
          echo "all five credentials present"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false
          # Full history: the publish plan compares each module against the tag IT last published
          # at. With a shallow clone those tags are absent, the plan takes its fail-safe path and
          # publishes everything while reporting success.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the manifest and gradle.properties
        run: |
          set -euo pipefail
          want="${TAG_NAME#v}"
          manifest="$(python3 -c 'import json;print(json.load(open(".release-please-manifest.json"))["."])')"
          props="$(sed -n 's/^watchfaceToolsVersion=//p' gradle.properties)"
          if [ "$want" != "$manifest" ] || [ "$want" != "$props" ]; then
            echo "::error::tag $TAG_NAME implies $want, manifest says $manifest, gradle.properties says $props."
            exit 1
          fi
          echo "publishing $want"

      - name: Android SDK (aapt2, zipalign, android.jar for :wff-packager tests)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36"

      # Which modules this release uploads. `maven-publish-plan.sh` compares each module against the
      # tag it last published at (read from Maven Central), propagates to dependents, and resolves
      # every uncertainty to "publish". Nothing is published yet, so the first release finds no
      # baseline and publishes everything.
      #
      # A `workflow_dispatch` recovery run gets no plan: its baseline may not be trustworthy and
      # publishing everything is the safe answer. An EMPTY set from a plan is a real answer ("no
      # module changed"), kept apart from "no plan ran" by PUBLISH_PLANNED.
      - name: Compute the publish plan
        run: |
          set -euo pipefail
          PUBLISH_SET=""
          PUBLISH_PLANNED=false
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            # `--write-manifest` puts the Central baseline into the workspace, where the Gradle
            # build reads it to give a skipped module the version it is already published at.
            # Written, never committed.
            PUBLISH_SET="$(.github/scripts/maven-publish-plan.sh --head "$TAG_NAME" \
              --write-manifest publishing-manifest.json | paste -sd, -)"
            PUBLISH_PLANNED=true
          fi
          echo "plan ran: $PUBLISH_PLANNED; publish set: ${PUBLISH_SET:-<empty>}"
          echo "PUBLISH_SET=$PUBLISH_SET" >> "$GITHUB_ENV"
          echo "PUBLISH_PLANNED=$PUBLISH_PLANNED" >> "$GITHUB_ENV"

      # Everything the artifacts must survive, before they are permanent, plus the build logic and
      # release scripts that decide what gets uploaded.
      - name: Check
        env:
          WFF_REQUIRE_SDK: "1"
        run: |
          ./gradlew -p build-logic test
          ./gradlew -Prelease ktfmtCheck :wff-core:check :wff-apk:check :wff-packager:check
          python3 -m unittest discover -s .github/scripts/tests

      # A dry run against the local repository, signed: the POMs either resolve every internal
      # coordinate or they do not, and finding that out here costs nothing while finding it out on
      # Central costs a version number. The signing keys are needed HERE too: every release
      # publication is signed, so `publishToMavenLocal` fails with "No configured signatory" without
      # them. Central's own credentials are deliberately not passed.
      - name: Publish to Maven Local first
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          V="${TAG_NAME#v}"
          PLAN_ARGS=()
          if [ "$PUBLISH_PLANNED" = "true" ]; then
            PLAN_ARGS+=("-Pwatchface.publishSet=$PUBLISH_SET")
          fi
          ./gradlew -Prelease publishToMavenLocal "${PLAN_ARGS[@]}"
          # Each coordinate is checked at the version it will carry: the tag for what this release
          # publishes, the recorded version for what it skips. An empty publish set is passed as an
          # empty `--publish-set`; omitting it means "no plan ran".
          if [ "$PUBLISH_PLANNED" = "true" ]; then
            .github/scripts/expected-poms.py --version "$V" --publish-set "$PUBLISH_SET" > /tmp/expected-poms
          else
            .github/scripts/expected-poms.py --version "$V" > /tmp/expected-poms
          fi
          count=0
          while read -r m v; do
            pom="$HOME/.m2/repository/ee/schimke/watchface/$m/$v/$m-$v.pom"
            [ -f "$pom" ] || { echo "::error::$m did not produce a POM at $v"; exit 1; }
            [ -f "$pom.asc" ] || { echo "::error::$m $v POM is not signed"; exit 1; }
            count=$((count + 1))
          done < /tmp/expected-poms
          echo "$count coordinates produced signed artifacts"

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        # Task resolution, the empty-plan `exit 0` and the upload live in a script so their
        # branches are tested (.github/scripts/tests/, run by ci.yml).
        run: .github/scripts/publish-to-central.sh

      - name: Publish the GitHub release
        run: gh release edit "$TAG_NAME" --draft=false --latest
