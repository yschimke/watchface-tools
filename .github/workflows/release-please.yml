# Keeps a "chore(main): release X.Y.Z" pull request up to date, and turns merging it into a
# Maven Central publish (release.yml).
#
# Two release-please invocations, deliberately, as in compose-preview-contracts: releases are
# drafts, and a draft creates no tag, so a single invocation that also computes the next release
# PR reads the previous release as its baseline and re-proposes the version being released.
name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "release-please-${{ github.ref }}-${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release ') && github.sha || 'updates' }}"
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags + GitHub Releases
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # A draft release does not create its tag, and release.yml checks out the tag. Tag the commit
      # release-please released (outputs.sha), never github.sha.
      - name: Ensure the release tag exists for the draft
        if: ${{ !cancelled() && steps.rp.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.rp.outputs.tag_name }}
          SHA: ${{ steps.rp.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/{owner}/{repo}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists"
            exit 0
          fi
          gh api --method POST "repos/{owner}/{repo}/git/refs" \
            -f "ref=refs/tags/${TAG}" -f "sha=${SHA}" >/dev/null
          echo "created tag ${TAG} at ${SHA}"

  release:
    name: Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      # No `pull-requests: write`: a called workflow cannot elevate what its caller granted, and
      # asking for more is a startup failure of the whole run with nothing in the log to say why.
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  # The Wear OS push app to Google Play's internal track, beside (not after) the Maven publish: a
  # Play failure must not hold the library release, nor the reverse. Opt-in through the PLAY_PUBLISH
  # repository variable; see docs/PLAY_PUBLISHING.md.
  play-release:
    name: Play release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/play-release.yml
    permissions:
      contents: read
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      publish_play: ${{ vars.PLAY_PUBLISH == 'true' }}
    secrets:
      PUSH_APP_UPLOAD_KEYSTORE: ${{ secrets.PUSH_APP_UPLOAD_KEYSTORE }}
      PUSH_APP_KEYSTORE_PASSWORD: ${{ secrets.PUSH_APP_KEYSTORE_PASSWORD }}
      PUSH_APP_KEY_ALIAS: ${{ secrets.PUSH_APP_KEY_ALIAS }}
      PUSH_APP_KEY_PASSWORD: ${{ secrets.PUSH_APP_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  # Standalone HTTP packager/validator container (ghcr.io/yschimke/watchface-push-server), beside
  # the Maven publish so Watchtower-managed hosts pick up new watchface-tools releases directly.
  push-server-image:
    name: Push-server image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/push-server-image.yml
    permissions:
      contents: read
      packages: write
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  # The PR half, split out so it never runs against a half-published release. Runs on an ordinary
  # push, or straight after a SUCCESSFUL release; never after a failed one (its baseline would be
  # stale and produce a phantom release PR).
  update-release-pr:
    name: Update the release PR
    needs: [release-please, release]
    if: >-
      ${{ !cancelled()
      && (needs.release-please.outputs.release_created != 'true'
      || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.rp.outputs.pr }}
      in_flight: ${{ steps.preflight.outputs.in_flight }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # An ordinary push and a release-PR merge hold separate concurrency slots, so this pass can
      # run while another run's release is still a draft, which release-please cannot see: it would
      # baseline on the release before and rewrite the release PR with already-released history.
      # The guard skips the pass while a release is in flight and closes a duplicate a mid-run
      # merge still produced. See `.github/scripts/release-pr-race-guard.sh`.
      - name: Check whether a release is in flight
        id: preflight
        if: ${{ needs.release-please.outputs.release_created != 'true' }}
        env:
          MODE: check
        run: ./.github/scripts/release-pr-race-guard.sh

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        if: ${{ steps.preflight.outputs.in_flight != 'true' }}
        # The failure this tolerates is the race's own; the last step re-raises anything else.
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Discard a release PR the race produced
        id: repair
        if: ${{ always() && needs.release-please.outputs.release_created != 'true' && steps.preflight.outputs.in_flight != 'true' }}
        env:
          MODE: repair
          RP_PR: ${{ steps.rp.outputs.pr }}
        run: ./.github/scripts/release-pr-race-guard.sh

      - name: Re-raise a release-please failure the race does not explain
        if: ${{ always() && steps.rp.outcome == 'failure' && steps.repair.outputs.raced != 'true' }}
        run: |
          echo "::error::release-please failed and no release was in flight; see the step above."
          exit 1

  # Which Maven coordinates merging the release PR would publish, as one comment on that PR. The
  # plan otherwise only runs inside the release, after the irreversible upload. Same script, same
  # Central baseline, run against the release PR's head. Informational: it never fails.
  release-pr-publish-plan:
    needs: update-release-pr
    if: ${{ !cancelled() && needs.update-release-pr.result == 'success' && needs.update-release-pr.outputs.in_flight != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # create/edit the comment on the release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Comment the publish plan on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          RP_PR: ${{ needs.update-release-pr.outputs.pr }}
        run: ./.github/scripts/release-pr-publish-plan.sh
