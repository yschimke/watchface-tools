name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK (aapt2, zipalign, android.jar for :wff-packager)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" "platforms;android-37.0"
      - name: Format
        run: ./gradlew ktfmtCheck
      - name: Test
        env:
          # Make the SDK-dependent packager tests fail instead of skipping when the SDK is absent.
          WFF_REQUIRE_SDK: "1"
        run: ./gradlew :wff-core:jvmTest :wff-core:compileKotlinWasmJs :wff-packager:test
      - name: Release tooling (build-logic tests, publish plan and script tests, printPublishTasks)
        run: |
          ./gradlew -p build-logic test
          python3 -m unittest discover -s .github/scripts/tests -v
          .github/scripts/tests/print-publish-tasks-test.sh
      - name: Push app (assemble + unit tests)
        run: ./gradlew :push-app:assembleDebug :push-app:testDebugUnitTest
