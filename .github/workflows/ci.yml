name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21.0.13+9.0.LTS
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Android SDK (aapt2, zipalign, android.jar for :wff-packager)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" "platforms;android-37.0"
      - name: Format
        run: ./gradlew ktfmtCheck
      - name: Test
        env:
          # Make the SDK-dependent packager tests fail instead of skipping when the SDK is absent.
          WFF_REQUIRE_SDK: "1"
        run: ./gradlew :wff-core:jvmTest :wff-core:compileKotlinWasmJs :wff-apk:jvmTest :wff-apk:wasmJsBrowserTest :wff-packager:test :push-server:test :push-server:distTar
      - name: Release tooling (build-logic tests, publish plan and script tests, printPublishTasks)
        run: |
          ./gradlew -p build-logic test
          python3 -m unittest discover -s .github/scripts/tests -v
          .github/scripts/tests/print-publish-tasks-test.sh
          .github/scripts/tests/release-pr-race-guard-test.sh
      - name: Push app (assemble, unit tests, unsigned release bundle)
        run: ./gradlew :push-app:assembleDebug :push-app:testDebugUnitTest :push-app:bundleRelease
      - name: Phone app (assemble, unit tests, lint)
        run: ./gradlew :mobile-app:assembleDebug :mobile-app:testDebugUnitTest :mobile-app:lintDebug
