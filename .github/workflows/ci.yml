name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Format
        run: ./gradlew ktfmtCheck
      - name: Test
        run: ./gradlew :wff-core:jvmTest :wff-core:compileKotlinWasmJs
