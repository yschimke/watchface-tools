name: UI Builder catalog

on:
  pull_request:
    paths:
      - 'ui-builder-catalog/**'
      - 'catalog-ui-builder-renderer/**'
      - '.github/workflows/ui-builder-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'ui-builder-catalog/**'
      - 'catalog-ui-builder-renderer/**'
      - '.github/workflows/ui-builder-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-builder-catalog-${{ github.ref }}
  cancel-in-progress: false

env:
  UI_BUILDER_SDK_REF: v3.141.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: watchface-tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yschimke/compose-ui-builder
          ref: ${{ env.UI_BUILDER_SDK_REF }}
          path: compose-ui-builder
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17.0.21+9
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21.0.13+9.0.LTS
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Validate catalog metadata
        run: python3 watchface-tools/ui-builder-catalog/validate.py
      - name: Build and verify catalog-owned WFF renderer runtime
        working-directory: watchface-tools
        run: >-
          ./gradlew :catalog-ui-builder-renderer:ktfmtCheck :catalog-ui-builder-renderer:check
          -PcomposeUiBuilderDir=../compose-ui-builder
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wff-watchface-ui-builder-renderer
          path: watchface-tools/catalog-ui-builder-renderer/build/distributions/wff-watchface-ui-builder-renderer.zip
          retention-days: 1

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wff-watchface-ui-builder-renderer
          path: ${{ runner.temp }}/runtime
      - name: Publish to design-artifacts/wff-watchface
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUNTIME_ZIP: ${{ runner.temp }}/runtime/wff-watchface-ui-builder-renderer.zip
        run: |
          set -euo pipefail
          branch=design-artifacts/wff-watchface
          out="$RUNNER_TEMP/out"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$out" --no-checkout --depth 1 \
            $(git ls-remote --exit-code --heads "https://github.com/${REPO}.git" "$branch" >/dev/null 2>&1 && echo "--branch $branch")
          cd "$out"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git checkout "$branch"
          else
            git checkout --orphan "$branch"
          fi
          git rm -rf --quiet --ignore-unmatch .
          cp -R "$GITHUB_WORKSPACE/ui-builder-catalog/." .
          mkdir -p ui-builder
          cp "$RUNTIME_ZIP" ui-builder/runtime.zip
          python3 - <<'PY'
          import json, pathlib, zipfile
          manifest = json.loads(zipfile.ZipFile("ui-builder/runtime.zip").read("runtime-manifest.json").decode("utf-8"))
          catalog_path = pathlib.Path("catalog.json")
          catalog = json.loads(catalog_path.read_text())
          catalog["uiBuilderRuntime"] = {
              "runtimeId": manifest["runtimeId"],
              "protocolVersion": manifest["protocolVersion"],
              "path": "ui-builder/runtime.zip",
              "integritySha256": manifest["integritySha256"],
          }
          catalog_path.write_text(json.dumps(catalog, indent=2) + "\n")
          PY
          python3 validate.py
          rm -f validate.py README.md
          printf '%s\n' "$SOURCE_SHA" > source-commit.txt
          git add -A
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit --quiet -m 'chore(wff-watchface): publish UI Builder catalog and renderer runtime' -m "Source: ${REPO}@${SOURCE_SHA}"
          git push origin "HEAD:${branch}"
